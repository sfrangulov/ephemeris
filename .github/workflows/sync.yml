name: portfolio-sync

# The single data pipeline: discover packages from npm by maintainer, then load
# downloads, metadata, current stars, and one-time stargazer-history backfill.
# Idempotent. Runs every 6 hours; manual dispatch runs on demand.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22+ for the global WebSocket that @supabase/realtime-js needs.
          node-version: 22
          cache: npm
      # npm install (not ci): tolerant of cross-platform optional-dep lockfile
      # drift (@emnapi wasm fallbacks) for this worker job.
      - run: npm install --no-audit --no-fund
      - run: npx tsx scripts/sync.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
