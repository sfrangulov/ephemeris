name: stargazer-backfill

# One-time-per-package star-history reconstruction for anything flagged
# backfill_status='pending'. Once 'done', a package is never reprocessed.
# Idempotent: a no-op when nothing is pending. Sweeps every 6 hours; manual
# dispatch runs on demand.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/backfill.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
