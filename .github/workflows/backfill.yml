name: stargazer-backfill

# One-time-per-package star-history reconstruction for anything flagged
# backfill_status='pending'. Once 'done', a package is never reprocessed, so a
# daily sweep (just after the 06:00 snapshot cron flips new repos to pending)
# is plenty. Idempotent: a no-op when nothing is pending. Use the manual
# dispatch to run on demand.
on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/backfill.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
